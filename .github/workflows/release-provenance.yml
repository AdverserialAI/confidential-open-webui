name: Release provenance

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin actions that execute with release and attestation credentials.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write pinned release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: https://github.com/${{ github.repository }}
        run: node scripts/write-release-manifest.mjs static/release.json
      - run: npm run build
      - name: Package client
        run: |
          tar -C build -czf confidential-open-webui-${{ github.ref_name }}.tar.gz .
          sha256sum confidential-open-webui-${{ github.ref_name }}.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: confidential-open-webui-${{ github.ref_name }}.tar.gz
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            confidential-open-webui-${{ github.ref_name }}.tar.gz SHA256SUMS static/release.json --clobber
